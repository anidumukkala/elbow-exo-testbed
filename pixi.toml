[workspace]
authors = ["Yuanshao Yang <yyang3051@gatech.edu>"]
channels = ["conda-forge"]
name = "elbow-exo-testbed"
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64", "linux-aarch64"]
version = "0.1.0"

[tasks]
can-up = "bash setup/can_up.sh"
home-manual = "python home_manual.py"
home-auto-10to1 = "python home_auto_10to1.py"
chirp-free-10to1 = "python free_chirp_10to1.py"
passive-exo-10to1 = "python passive_exo_10to1.py"
passive-exo-10to1-dry = "python passive_exo_10to1.py --dry-run"
home-auto-40to1 = "python home_auto_40to1.py"
chirp-free-40to1 = "python free_chirp_40to1.py"
passive-exo-40to1 = "python passive_exo_40to1.py"
passive-exo-40to1-dry = "python passive_exo_40to1.py --dry-run"
analyze-passive = "python analyze_passive_exo.py"
test-passive = "python tests/test_passive_pipeline.py"

[dependencies]
python = "3.12.*"
numpy = "<2"
matplotlib = ">=3.11.2,<4"

[pypi-dependencies]
damiao-motor = ">=1.0.6, <2"
